<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — MotoFix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="glow"></div>

      <div class="login-wrap">
        <div class="brand-block">
          <div class="brand-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="5.5" cy="17.5" r="3.5"></circle>
              <circle cx="18.5" cy="17.5" r="3.5"></circle>
              <circle cx="15" cy="5" r="1"></circle>
              <path d="M12 17.5V14l-3-3 4-3 2 3h2"></path>
            </svg>
          </div>
          <h1 class="brand-name">MOTO<span>FIX</span></h1>
          <p class="brand-tag">Motorcycle Maintenance Services System</p>
        </div>

        <div class="auth-card">
          <h2>Sign In</h2>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="admin@motofix.com"
                autocomplete="email"
                required
              />
              <span class="field-error" id="emailError"></span>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label for="password">Password</label>
                <a href="#" class="link-small" id="forgotLink"
                  >Forgot Password?</a
                >
              </div>
              <div class="password-wrap">
                <input
                  type="password"
                  id="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-pw"
                  id="togglePw"
                  aria-label="Show password"
                >
                  👁
                </button>
              </div>
              <span class="field-error" id="passwordError"></span>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
          </form>

          <div class="divider"></div>

          <p class="demo-label">Quick demo login</p>
          <div class="demo-grid">
            <button
              class="demo-btn demo-admin"
              data-role="admin"
              data-email="admin@motofix.com"
              data-password="admin123"
            >
              <span class="demo-ico">🛡</span>
              <span>Admin</span>
            </button>
            <button
              class="demo-btn demo-mechanic"
              data-role="mechanic"
              data-email="mechanic1@motofix.com"
              data-password="mech123"
            >
              <span class="demo-ico">🔧</span>
              <span>Mechanic</span>
            </button>
            <button
              class="demo-btn demo-customer"
              data-role="customer"
              data-email="jose@email.com"
              data-password="cust123"
            >
              <span class="demo-ico">👤</span>
              <span>Customer</span>
            </button>
          </div>

          <p class="signup-row">
            Don't have an account? <a href="#" id="signupLink">Sign Up</a>
          </p>
        </div>

        <p class="footer-note">© 2026 MotoFix. All rights reserved.</p>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/login.js"></script>
  </body>
</html>
