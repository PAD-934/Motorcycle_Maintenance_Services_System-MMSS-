<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — MotoFix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="glow"></div>

      <div class="login-wrap">
        <a href="index.html" class="brand_link_to_homepage">
          <div class="brand-block">
            <div class="brand-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="5.5" cy="17.5" r="3.5"></circle>
                <circle cx="18.5" cy="17.5" r="3.5"></circle>
                <circle cx="15" cy="5" r="1"></circle>
                <path d="M12 17.5V14l-3-3 4-3 2 3h2"></path>
              </svg>
            </div>
            <h1 class="brand-name">MOTO<span>FIX</span></h1>
            <p class="brand-tag">Motorcycle Maintenance Services System</p>
          </div>
        </a>

        <div class="auth-card">
          <!-- Back to Homepage Button -->
          <div style="margin-bottom: 20px;">
            <a href="index.html" style="color: #a5a5af; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s;" onmouseover="this.style.color='#ff6600'" onmouseout="this.style.color='#a5a5af'">
              ← Back to Homepage
            </a>
          </div>

          <h2>Sign In</h2>

          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                placeholder="admin@motofix.com"
                autocomplete="email"
                required
              />
              <span class="field-error" id="emailError"></span>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label for="password">Password</label>
                <a href="#" class="link-small" id="forgotLink"
                  >Forgot Password?</a
                >
              </div>
              <div class="password-wrap">
                <input
                  type="password"
                  id="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-pw"
                  id="togglePw"
                  aria-label="Show password"
                >
                  👁
                </button>
              </div>
              <span class="field-error" id="passwordError"></span>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
          </form>

          <p class="signup-row" style="margin-top: 25px;">
            Don't have an account? <a href="signup.html" id="signupLink">Sign Up</a>
          </p>
        </div>

        <p class="footer-note">© 2026 MotoFix. All rights reserved.</p>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="js/login.js"></script>
  </body>
</html>
